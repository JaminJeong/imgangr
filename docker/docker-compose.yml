services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: imgangr:latest
    container_name: imgangr-web
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.imgangr.description=임장기록 웹 앱"
      - "com.imgangr.version=1.0"
